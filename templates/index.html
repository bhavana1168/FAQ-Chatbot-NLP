<!DOCTYPE html>
<html>
<head>
    <title>FAQ Chatbot</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        #chatbox { border: 1px solid #ccc; padding: 10px; width: 500px; height: 400px; overflow-y: scroll; }
        input { width: 400px; padding: 5px; }
        button { padding: 5px; }
        .user { color: blue; }
        .bot { color: green; }
    </style>
</head>
<body>
    <h2>FAQ Chatbot</h2>
    <div id="chatbox"></div>
    <input type="text" id="user_input" placeholder="Type your question...">
    <button onclick="sendQuestion()">Send</button>

    <script>
        function sendQuestion() {
            let question = document.getElementById("user_input").value;
            if (!question) return;
            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += "<p class='user'><b>You:</b> " + question + "</p>";
            fetch("/get_answer", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({question: question})
            })
            .then(response => response.json())
            .then(data => {
                chatbox.innerHTML += "<p class='bot'><b>Bot:</b> " + data.answer + "</p>";
                chatbox.scrollTop = chatbox.scrollHeight;
            });
            document.getElementById("user_input").value = "";
        }
    </script>
</body>
</html>
